name: Stage A B validation
on:
  push:
    branches: [certified-stage-ab-h2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install scientific dependencies
        run: |
          python -m pip install numpy scipy pytest matplotlib mpmath 'cantera==3.2.0'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run regression tests
        run: python -m pytest -q --junitxml=validation/junit.xml
      - name: Reproducible validation inputs
        if: always()
        run: |
          mkdir -p validation/wheels
          git archive HEAD -o validation/source.zip
          python -m pip download --only-binary=:all: --no-deps 'cantera==3.2.0' 'ruamel.yaml==0.18.16' -d validation/wheels
          python -m pip freeze > validation/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-ab-validation
          path: validation/
          retention-days: 7
